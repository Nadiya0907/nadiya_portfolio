server.port=8080
spring.application.name=nadz-portfolio

# Local MySQL (only used if you run locally — Railway overrides these)
spring.datasource.url=jdbc:mysql://localhost:3306/nadz_portfolio?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Email (leave blank to disable)
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
portfolio.contact.recipient=

# GitHub
github.username=Nadiya0907
github.token=

# CORS — updated in Step 5
portfolio.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

management.endpoints.web.exposure.include=health,info
